name: 每日更新與部署

on:
  schedule:
    # 台灣時間（UTC+8）週一至週五 16:40、18:40、21:10；投信與處置資料較晚公布，分三次補齊
    - cron: "40 8 * * 1-5"
    - cron: "40 10 * * 1-5"
    - cron: "10 13 * * 1-5"
  workflow_dispatch:
    inputs:
      refetch:
        description: "重抓指定日期（YYYYMMDD，空白則只補缺）"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["web/**", "engine.py", "build.py", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取官方資料
        if: github.event_name != 'push'
        env:
          TZ: Asia/Taipei
          PYTHONIOENCODING: utf-8
          REFETCH: ${{ github.event.inputs.refetch }}
        run: |
          if [ -n "$REFETCH" ]; then python fetch.py --refetch "$REFETCH"; fi
          python fetch.py
      - name: 保存資料到儲存庫
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d_%H:%M)"
          git push
      - name: 產生網站
        env:
          PYTHONIOENCODING: utf-8
        run: python build.py --days 60
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
