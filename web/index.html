<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台股條件篩選</title>
<meta name="description" content="台股上市櫃每日條件選股">
<meta name="theme-color" content="#fbf6f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="台股篩選">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#fbf6f8;--panel:#ffffff;--ink:#2b1b23;--muted:#8b707c;--line:#f0dfe6;
  --accent:#c2457a;--accent-dark:#9b2c5c;--accent-ink:#ffffff;--soft:#fce8f0;--badge:#f8dbe7;
  --up:#d6334a;--down:#5a7698;--warn:#a2600f;--warn-bg:#fff3e2;--hl:#fff5f9;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1216;--panel:#241a1f;--ink:#f6eaf0;--muted:#b99dab;--line:#3b2a33;
  --accent:#f07aa8;--accent-dark:#c2457a;--accent-ink:#ffffff;--soft:#3a2130;--badge:#4b2a3b;
  --up:#ff6b7f;--down:#93b2d8;--warn:#f0b65a;--warn-bg:#33261a;--hl:#2c2027;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
input,select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:46px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{min-height:0;width:20px;height:20px;padding:0;accent-color:var(--accent);flex:none;border-radius:4px}
button{cursor:pointer;font-weight:500}
button.primary{background:var(--accent-dark);color:var(--accent-ink);border-color:var(--accent-dark);font-weight:600}
button:disabled{opacity:.55;cursor:default}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- 頁首 ---------- */
header{padding:calc(var(--sat) + 28px) 0 8px}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.heroRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
h1{font-size:27px;line-height:1.3;margin:0;font-weight:700}
.heroBtns{margin-left:auto;display:flex;gap:10px;order:2}
.lead{color:var(--muted);font-size:15px;margin:0 0 6px;flex-basis:100%;order:3}
.pill{margin-top:8px}
.pill{background:var(--soft);border-radius:18px;padding:10px 16px;font-size:13px;line-height:1.7;color:var(--ink)}
.pill .sep{color:var(--muted);margin:0 6px}
.ok{color:var(--accent-dark)} .pend{color:var(--warn)} .bad{color:var(--up)}
@media (prefers-color-scheme:dark){.ok{color:var(--accent)}}
.warnpill{background:var(--warn-bg);color:var(--warn);border-radius:18px;padding:10px 16px;font-size:13px;line-height:1.7;margin-top:10px;display:none}
#jobMsg{font-size:13px;color:var(--muted);margin-top:8px;min-height:0}
#jobMsg:empty{display:none}

/* ---------- 策略卡片 ---------- */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 16px}
.scard{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:70px;padding:12px 16px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;cursor:pointer;font-size:15px;line-height:1.45;user-select:none;text-align:left;transition:border-color .15s,background .15s}
.scard:hover{border-color:var(--accent)}
.scard .badge{flex:none;min-width:34px;padding:1px 9px;border-radius:999px;background:var(--badge);color:var(--accent-dark);font-size:13px;text-align:center;font-weight:600}
.scard.on{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;font-weight:600}
.scard.on .badge{background:rgba(255,255,255,.2);color:#fff}
.scard.center{justify-content:center}
.scard.star{border-color:var(--accent);color:var(--accent-dark);font-weight:600}
@media (prefers-color-scheme:dark){.scard .badge{color:#ffd3e3}.scard.star{color:var(--accent)}}
.scard.star.on{color:#fff}

/* ---------- 卡片 / 表單 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.summary{display:flex;align-items:center;gap:16px}
.summary h2{font-size:22px;margin:0 0 4px;font-weight:700}
.summary .desc{font-size:14px;color:var(--muted)}
.summary .desc code{background:var(--soft);color:var(--ink);padding:1px 6px;border-radius:6px;font-size:13px}
.bigcount{margin-left:auto;text-align:right;white-space:nowrap}
.bigcount b{font-size:40px;line-height:1;font-weight:700}
.bigcount span{font-size:13px;color:var(--muted);margin-left:2px}
.fgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px 14px;align-items:end}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select{width:100%}
.f input[type=checkbox]{width:20px}
.f.c3{grid-column:span 3}.f.c4{grid-column:span 4}.f.c2{grid-column:span 2}
.chk,.f.chk{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:46px;cursor:pointer}
.btns{display:flex;gap:10px}
.custom{display:none}
.custom.on{display:block}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 16px}
.cgrid label{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px;cursor:pointer}
.customRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:12px;align-items:end}
.inline{display:flex;gap:8px}
.inline > :first-child{flex:1;min-width:0}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.counts{font-size:14px;color:var(--muted);margin:4px 2px 12px}
.counts b{color:var(--ink)}

/* ---------- 表格 ---------- */
.tablewrap{overflow:auto;max-height:calc(100vh - 80px);border:1px solid var(--line);border-radius:18px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:14px 14px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:var(--hl);color:var(--muted);font-weight:500;font-size:13px;z-index:1}
td.l,th.l{text-align:left}
td.name b{display:block;font-weight:600}
td.name small{color:var(--muted);font-size:12px}
tbody tr:hover td{background:var(--hl)}
tr.und td{opacity:.7}
.up{color:var(--up)} .dn{color:var(--down)}
.tagU{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn);margin-left:6px;vertical-align:middle;font-weight:500}
.empty{padding:36px;text-align:center;color:var(--muted);white-space:normal}

/* ---------- 手機卡片 ---------- */
#cards{display:none}
.scardList .item{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 18px 8px;margin-bottom:12px}
.item.und{opacity:.75}
.item h3{margin:0;font-size:20px;font-weight:700}
.item .code{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;margin-top:10px}
.kv div{padding:10px 0;border-top:1px solid var(--line);min-width:0}
.kv span{display:block;font-size:13px;color:var(--muted)}
.kv b{display:block;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv .big b{font-size:28px;font-weight:700;line-height:1.25}
.moreBtn{width:100%;margin:4px 0 12px}

/* ---------- 今日選股觀察 ---------- */
#picksBox{display:none}
body.picksMode #picksBox{display:block}
body.picksMode #filters,body.picksMode #counts,body.picksMode .tablewrap,body.picksMode #cards{display:none!important}
.mk{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;margin-bottom:6px}
.sub2{font-size:13px;color:var(--muted)}
.disc{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.7;border-top:1px dashed var(--line);padding-top:10px}
.pickGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.ptop{display:flex;align-items:flex-start;gap:12px}
.rank{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.pname{font-size:18px;font-weight:700;line-height:1.3}
.pmeta{font-size:13px;color:var(--muted)}
.pprice{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.pprice .px{font-size:22px;font-weight:700;line-height:1.2}
.pprice .pc{font-size:14px;font-weight:600}
.score{margin-top:10px;font-size:13px;color:var(--muted)}
.score b{font-size:17px;color:var(--accent-dark)}
@media (prefers-color-scheme:dark){.score b{color:var(--accent)}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;padding:3px 10px;border-radius:999px;line-height:1.6}
.tag.why{background:var(--soft);color:var(--accent-dark)}
@media (prefers-color-scheme:dark){.tag.why{color:#ffd3e3}}
.tag.risk{background:var(--warn-bg);color:var(--warn)}
h3.sec{font-size:18px;margin:0 0 10px;font-weight:700}
.comment{font-size:15px;line-height:1.85;margin-top:8px}
.rules{margin:4px 0 0;padding-left:20px;font-size:14px;line-height:1.8}
.rules li{margin:4px 0}
.pick.alert{border-color:var(--warn-bg)}

footer{color:var(--muted);font-size:13px;line-height:1.8;padding:8px 0 calc(40px + var(--sab));border-top:1px solid var(--line);margin-top:24px}
footer p{margin:8px 0}

/* 加入主畫面說明 */
dialog{border:none;border-radius:18px;padding:22px;max-width:420px;width:calc(100% - 32px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(40,10,25,.4)}
dialog h3{margin:0 0 10px;font-size:18px}
dialog ol{padding-left:20px;margin:6px 0 14px;line-height:1.8}

/* ---------- 平板 ---------- */
@media (max-width:980px){
  .sgrid{grid-template-columns:repeat(3,1fr)}
  .f.c3{grid-column:span 6}.f.c4{grid-column:span 6}.f.c2{grid-column:span 6}
}
/* ---------- 手機 ---------- */
@media (max-width:640px){
  .wrap{padding:0 16px}
  header{padding-top:calc(var(--sat) + 22px)}
  .heroBtns{margin-left:0;width:100%;order:3}
  .lead{order:2;margin:0}
  .sgrid{grid-template-columns:1fr 1fr;gap:10px}
  .scard{min-height:76px;padding:12px 14px}
  .card{padding:18px 16px}
  .summary h2{font-size:21px}
  .bigcount b{font-size:36px}
  .fgrid{grid-template-columns:1fr 1fr;gap:12px}
  .f.c3,.f.c4,.f.c2,.f.full{grid-column:span 2}
  .f.half{grid-column:span 1}
  .btns{grid-column:span 2}
  .btns button{flex:1}
  .customRow{grid-template-columns:1fr}
  .cgrid{grid-template-columns:1fr}
  .tablewrap{display:none}
  #cards{display:block}
  .pickGrid{grid-template-columns:1fr;gap:12px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">TAIWAN STOCK · DAILY SCREEN</div>
  <div class="heroRow">
    <h1>台股條件篩選</h1>
    <p class="lead">把選股條件集中在一起，隨時切換、搜尋與比較。</p>
    <div class="heroBtns">
      <button id="btnA2HS">加入手機主畫面</button>
      <button id="btnUpdate">重新整理</button>
    </div>
  </div>
  <div class="pill" id="statusPill">載入中…</div>
  <div class="warnpill" id="warnBox"></div>
  <div id="jobMsg"></div>
</header>

<main>
  <nav class="sgrid" id="tabs" aria-label="策略"></nav>

  <section class="card summary" id="summary"></section>

  <section class="card custom" id="customPanel">
    <div class="cgrid" id="condGrid"></div>
    <div class="customRow">
      <div class="f"><label for="macdSel">MACD 條件</label>
        <select id="macdSel"><option value="">不限</option><option value="mS">綠柱縮短</option><option value="mG">紅柱增長</option><option value="mT">由綠翻紅</option></select></div>
      <div class="f"><label for="comboSel">已存組合</label><div class="inline"><select id="comboSel"><option value="">—</option></select><button id="btnDel">刪除</button></div></div>
      <div class="f"><label for="comboName">組合名稱</label><div class="inline"><input id="comboName" placeholder="例如：突破＋投信"><button id="btnSave" class="primary">儲存</button></div></div>
    </div>
    <div class="hint">已勾選條件全部 AND（同時成立）；組合儲存在這台裝置的瀏覽器。</div>
  </section>

  <section class="card" id="filters" aria-label="篩選與排序">
    <div class="fgrid">
      <div class="f c3"><label for="date">資料日期</label><select id="date"></select></div>
      <div class="f c4"><label for="q">股票搜尋</label><input id="q" placeholder="輸入代號或名稱" inputmode="search"></div>
      <div class="f c2 half"><label for="mkt">市場</label><select id="mkt"><option value="">全部市場</option><option>上市</option><option>上櫃</option></select></div>
      <div class="f c3 half"><label for="minClose">最低收盤價（元）</label><input id="minClose" type="number" value="200" min="0" step="1" inputmode="decimal"></div>
      <div class="f c3 half"><label for="minVinc">最低量增幅（%）</label><input id="minVinc" type="number" placeholder="不限" inputmode="decimal"></div>
      <div class="f c3 full"><label for="sort">排序</label>
        <select id="sort">
          <option value="cDesc">收盤價：高到低</option><option value="cAsc">收盤價：低到高</option>
          <option value="chg">今日漲跌幅：高到低</option><option value="vinc">量增幅：高到低</option>
          <option value="vol">成交量：高到低</option><option value="trust">投信兩日買超：高到低</option>
          <option value="code">股票代號</option>
        </select></div>
      <label class="chk f c3 half"><input type="checkbox" id="addTrust">另加投信連兩日買超</label>
      <label class="chk f c3 half"><input type="checkbox" id="showUnd">列出未判定</label>
      <div class="btns f c3 full" style="flex-direction:row"><button id="btnReset">重設篩選</button><button id="btnExport" class="primary">匯出目前名單</button></div>
    </div>
  </section>

  <div class="counts" id="counts"></div>
  <div id="picksBox"></div>
  <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <div id="cards" class="scardList"></div>
</main>

<footer id="foot"></footer>
</div>

<dialog id="a2hs">
  <h3>加入手機主畫面</h3>
  <div><b>iPhone（Safari）</b><ol><li>點下方「分享」按鈕</li><li>選「加入主畫面」</li></ol></div>
  <div><b>Android（Chrome）</b><ol><li>點右上角「⋮」</li><li>選「加到主畫面」或「安裝應用程式」</li></ol></div>
  <button class="primary" style="width:100%" onclick="this.closest('dialog').close()">知道了</button>
</dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const STRATS = [
  {k:"picks", n:"★ 今日選股觀察", d:"以價格強弱為核心：追收盤漲停、創新高、突破前高與整數關卡、連漲、逆勢不跌的強勢股，並列出強勢股轉弱的出場警示。", cols:[]},
  {k:"s1", n:"突破增量", d:"今日最高價高於前一交易日最高價，且今日成交量大於前一交易日。", cols:[]},
  {k:"s2", n:"20日漲停破五日", d:"最近 20 個交易日至少一天收盤漲停，且今日收盤價低於五日線（不要求今天才剛跌破）。", cols:["lu20d","limit"]},
  {k:"s3", n:"漲停收十字", d:"前一交易日收盤漲停，且今日開盤價＝收盤價（嚴格相等）。", cols:["luPrev"]},
  {k:"s4", n:"五日線上揚・量縮一半", d:"今日五日線高於昨日五日線，且今日成交量 ≤ 昨日的一半。", cols:[]},
  {k:"s5", n:"低點墊高・量縮", d:"今日最低價高於前一交易日最低價，且今日成交量小於前一交易日（相等不列入）。", cols:["l","lp"]},
  {k:"s6", n:"投信連兩日買超", d:"投信今日與前一交易日各自買超（不是只看兩日合計）。", cols:["F","Fp","F2"]},
  {k:"s7", n:"下一交易日出關", d:"官方處置公告最後適用日為今日，預計下一交易日解除；已排除截至今日已公告的再次處置與延長，當日無成交者列為待核對。", cols:["dispP","dispK"]},
  {k:"s8", n:"月K由綠轉紅", d:"上月收盤低於上月開盤，且今日收盤價高於當月開盤價（該股當月首次成交日開盤價）。", cols:["pmO","pmC","cmO"]},
  {k:"s9", n:"日MACD綠柱縮短", d:"昨日、今日 MACD 柱體皆為負，且今日柱體大於昨日（負值往零靠近）。", cols:["dif","dea","histp","hist","mn"]},
  {k:"s10", n:"日MACD紅柱增長", d:"昨日、今日 MACD 柱體皆為正，且今日柱體大於昨日。", cols:["dif","dea","histp","hist","mn"]},
  {k:"s11", n:"日MACD由綠翻紅", d:"昨日柱體 ≤ 0 且今日柱體 > 0（零軸容差 1e-8）。", cols:["dif","dea","histp","hist","mn"]},
  {k:"custom", n:"自訂條件", d:"勾選的條件全部同時成立（AND）。全部未勾選且 MACD 不限時，只套用共同篩選條件。", cols:[]},
];
const CONDS = [
  {k:"c1", n:"今日最高突破前日最高", cols:[]},
  {k:"c2", n:"今日成交量大於前日", cols:[]},
  {k:"c3", n:"近 20 個交易日曾收盤漲停", cols:["lu20d"]},
  {k:"c4", n:"今日開盤價＝收盤價", cols:[]},
  {k:"c5", n:"今日五日線高於昨日五日線", cols:[]},
  {k:"c6", n:"今日成交量 ≤ 昨日一半", cols:[]},
  {k:"c7", n:"今日收盤價低於五日線", cols:[]},
  {k:"c8", n:"投信最近兩日各自買超", cols:["F","Fp","F2"]},
  {k:"c9", n:"上月綠 K、當月截至資料日紅 K", cols:["pmO","pmC","cmO"]},
  {k:"c10", n:"低點高於前日且成交量減少", cols:["l","lp"]},
];
const MACD_COLS = ["dif","dea","histp","hist","mn"];

// ---------- 格式 ----------
const fmtD = d => d ? `${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6)}` : "—";
const nf = (x, dg=2) => x==null || !isFinite(x) ? "—" : x.toLocaleString("zh-TW",{minimumFractionDigits:0,maximumFractionDigits:dg});
const nf4 = x => x==null || !isFinite(x) ? "—" : x.toFixed(4);
const lots = x => x==null ? "—" : Math.round(x/1000).toLocaleString("zh-TW");
const pct = x => x==null || !isFinite(x) ? "—" : (x>0?"+":"")+x.toFixed(2)+"%";
const cls = x => x==null ? "" : x>0 ? "up" : x<0 ? "dn" : "";
const tri = v => v===true ? "是" : v===false ? "否" : "未判定";
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const COLDEF = {

function lastHit(r){ return /^s\d+$/.test(cur) ? r.last?.[cur] : null; }
function AND(xs){ if (xs.some(x=>x===false)) return false; if (xs.some(x=>x==null)) return null; return true; }
function customSel(){ return { conds: CONDS.filter(c=>$("#cb_"+c.k).checked).map(c=>c.k), macd: $("#macdSel").value }; }
function stratFlag(r, k){
  if (k !== "custom") return r.f[k];
  const s = customSel(); const xs = s.conds.map(c=>r.f[c]); if (s.macd) xs.push(r.f[s.macd]);
  return xs.length ? AND(xs) : true;
}
function extraCols(){
  let extra = [];
  if (cur === "custom"){
    const s = customSel();
    s.conds.forEach(k=>extra.push(...CONDS.find(c=>c.k===k).cols));
    if (s.macd) extra.push(...MACD_COLS);
  } else extra = [...(STRATS.find(s=>s.k===cur)?.cols||[])];
  if ($("#addTrust").checked) extra.push("F","Fp","F2");
  return [...new Set(extra)];
}
function columns(){
  const cols = [...BASE_COLS, ...extraCols()];
  if (/^s\d+$/.test(cur)) cols.push("last");
  return cols;
}

// ---------- 篩選 ----------
function compute(k, collect){
  const q = $("#q").value.trim().toLowerCase(), mkt = $("#mkt").value;
  const minC = parseFloat($("#minClose").value), minV = $("#minVinc").value.trim()===""?null:parseFloat($("#minVinc").value);
  const trust = $("#addTrust").checked;
  const o = {base:0, missing:0, yes:[], und:[], yesT:0, undT:0, yesA:0, undA:0};
  for (const r of DATA.rows){
    if (mkt && r.mkt !== mkt) continue;
    if (q && !(r.code.includes(q) || r.name.toLowerCase().includes(q))) continue;
    if (r.c == null){ o.missing++; continue; }
    if (isFinite(minC) && r.c < minC) continue;
    o.base++;
    const conds = [stratFlag(r, k)];
    if (minV != null && isFinite(minV)) conds.push(r.vinc==null ? null : r.vinc >= minV);
    const a = AND(conds), b = AND([a, r.f.c8]);
    if (a===true) o.yesA++; else if (a==null) o.undA++;
    if (b===true) o.yesT++; else if (b==null) o.undT++;
    if (collect){ const use = trust ? b : a; if (use===true) o.yes.push(r); else if (use==null) o.und.push(r); }
  }
  return o;
}

function updateBadges(){
  const trust = $("#addTrust").checked;
  document.querySelectorAll(".scard").forEach(el=>{
    const k = el.dataset.k, b = el.querySelector(".badge"); if (!b) return;
    if (!DATA){ b.textContent = "…"; return; }
    if (k === "picks"){ b.textContent = (DATA.picks||[]).length; return; }
    if (k === "s7" && DATA.disposalCovered && !((DATA.disposalCovered["上市"]||"") >= DATA.date && (DATA.disposalCovered["上櫃"]||"") >= DATA.date)){ b.textContent = "待補"; return; }
    const o = compute(k, false); b.textContent = trust ? o.yesT : o.yesA;
  });
}

function summaryCard(n, sub){
  const s = STRATS.find(x=>x.k===cur);
  $("#summary").innerHTML = `<div><h2>${esc(s.n.replace("★ ",""))}</h2><div class="desc">${s.d}</div>${sub?`<div class="desc" style="margin-top:4px">${sub}</div>`:""}</div>
    <div class="bigcount"><b>${n}</b><span>檔</span></div>`;
}

function run(){
  if (!DATA) return;
  updateBadges();
  if (cur === "picks"){ summaryCard((DATA.picks||[]).length, ""); return renderPicks(); }
  const res = compute(cur, true), trust = $("#addTrust").checked;
  let list = res.yes.map(r=>({...r,_und:false}));
  if ($("#showUnd").checked) list = list.concat(res.und.map(r=>({...r,_und:true})));
  sortList(list);
  LIST = list;
  const und = trust ? res.undT : res.undA;
  summaryCard(trust ? res.yesT : res.yesA, trust ? "已另加：投信最近兩日各自買超" : "");
  $("#counts").innerHTML = `符合目前條件：未另加投信 <b>${res.yesA}</b> 檔｜另加投信連兩日買超 <b>${res.yesT}</b> 檔`
    + (und ? `｜<span class="pend">未判定 ${und} 檔（資料不足，不等於不成立）</span>` : "")
    + `｜通過共同篩選 ${res.base} 檔｜無收盤價 ${res.missing} 檔`;
  render();
}

function sortList(list){
  const s = $("#sort").value, N = x => x==null || !isFinite(x) ? -Infinity : x;
  const f = {
    cDesc:(a,b)=>N(b.c)-N(a.c), cAsc:(a,b)=>(a.c??Infinity)-(b.c??Infinity), chg:(a,b)=>N(b.chg)-N(a.chg),
    vinc:(a,b)=>N(b.vinc)-N(a.vinc), vol:(a,b)=>N(b.v)-N(a.v),
    trust:(a,b)=>N(b.F==null||b.Fp==null?null:b.F+b.Fp)-N(a.F==null||a.Fp==null?null:a.F+a.Fp),
    code:(a,b)=>a.code.localeCompare(b.code),
  }[s];
  list.sort((a,b)=> (a._und?1:0)-(b._und?1:0) || f(a,b));
}

    return `<td class="${d.l?'l':''} ${d.c?d.c(r):''}">${esc(d.v(r))}</td>`;

function item(r){
  const cols = columns().filter(k=>!["name","mkt"].includes(k));
  const kv = k => { const d = COLDEF[k]; const big = k==="c"||k==="chg"; return `<div class="${big?'big':''}"><span>${d.h}</span><b class="${d.c?d.c(r):''}">${esc(d.v(r))}</b></div>`; };
  return `<article class="item ${r._und?'und':''}"><h3>${esc(r.name)}${r._und?'<span class="tagU">未判定</span>':''}</h3>
    <div class="code">${r.code}・${r.mkt}</div><div class="kv">${cols.map(kv).join("")}</div></article>`;
}
function renderCards(reset){
  const box = $("#cards");
  if (reset){ shown = 0; box.innerHTML = ""; }
  if (!LIST.length){ box.innerHTML = `<div class="card empty">${emptyMsg()}</div>`; return; }
  box.querySelector(".moreBtn")?.remove();
  const next = LIST.slice(shown, shown + PAGE);
  box.insertAdjacentHTML("beforeend", next.map(item).join(""));
  shown += next.length;
  if (shown < LIST.length) box.insertAdjacentHTML("beforeend", `<button class="moreBtn">再顯示 ${Math.min(PAGE, LIST.length-shown)} 檔（共 ${LIST.length} 檔）</button>`);
}

// ---------- 匯出 ----------
function download(name, text){
  const blob = new Blob(["﻿"+text], {type:"text/csv;charset=utf-8"});
  const file = typeof File === "function" ? new File([blob], name, {type:"text/csv"}) : null;
  if (mq.matches && file && navigator.canShare?.({files:[file]})) { navigator.share({files:[file], title:name}).catch(()=>{}); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
const csvq = s => { s = s==null?"":String(s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
function exportCsv(){
  if (!DATA) return;
  if (cur === "picks"){
    const lines = ["排名,股票名稱,代號,市場,收盤價,今日漲跌幅(%),成交量(張),量增幅(%),強勢分數,入選理由,風險提示"];
    (DATA.picks||[]).forEach((p,i)=>lines.push([i+1,p.name,p.code,p.mkt,p.c,p.chg?.toFixed(2),Math.round((p.v||0)/1000),p.vinc==null?"":p.vinc.toFixed(2),p.score,p.why.join("；"),p.risk.join("；")].map(csvq).join(",")));
    return download(`今日選股觀察_${DATA.date}${DATA.status?.provisional?"_暫行":""}.csv`, lines.join("\n"));
  }
  const cols = ["name","code",...columns().slice(1)];
  const raw = k => { const d = COLDEF[k]; return d.x ? (r=>d.x(r)) : (r=>{ const v = d.v(r); return v==="—"?"":String(v).replace(/,/g,""); }); };
  const lines = [[...cols.map(k=>COLDEF[k].h), "判定"].map(csvq).join(",")];
  for (const r of LIST) lines.push([...cols.map(k=>raw(k)(r)), r._und?"未判定":"符合"].map(csvq).join(","));
  const sname = cur==="custom" ? ($("#comboSel").value || "自訂條件") : STRATS.find(s=>s.k===cur).n;
  const meta = `# 資料日期 ${fmtD(DATA.date)}${DATA.status?.provisional?"（暫行）":""}，策略 ${sname}，最低收盤價 ${$("#minClose").value}，市場 ${$("#mkt").value||"全部"}，${$("#addTrust").checked?"另加投信連兩日買超":"未另加投信"}`;
  download(`台股篩選_${sname}_${DATA.date}.csv`, meta+"\n"+lines.join("\n"));
}

function statusBar(){
  const s = DATA.status, ps = DATA.prevStatus || {};
  const ic = ok => ok ? '<b class="ok">✓</b>' : '<b class="pend">待補</b>';
  const dc = DATA.disposalCovered || {};
  const dispOk = (dc["上市"]||"") >= DATA.date && (dc["上櫃"]||"") >= DATA.date;

  $("#statusPill").innerHTML = [
    `資料日期 <b>${fmtD(DATA.date)}</b>${s.provisional?`（<b class="pend">暫行版 ${esc(s.asOf||"")}</b>）`:"（官方收盤）"}，比較 ${fmtD(DATA.prevDate)}`,
    `上市 ${ic(s.twse)} 上櫃 ${ic(s.tpex)} 投信 ${ic(s.inst_twse && s.inst_tpex)} 處置公告 ${dispOk?'<b class="ok">✓</b>':'<b class="pend">待核對</b>'}`,
    `MACD 歷史起點 ${fmtD(DATA.historyStart)}（${DATA.historyCount} 個交易日）`,
    `來源：臺灣證券交易所、證券櫃檯買賣中心`,
  ].join(sep);
  const warns = [];
  if (s.provisional) warns.push(`暫行版：本日行情為 13:30 收盤後擷取的即時行情快照（資料時間 ${esc(s.asOf||"")}），可能未含最後收盤集合競價，非官方收盤價；約 15:30 後會以官方資料自動校正。投信資料尚未公布，相關條件為未判定。`);
  if (!s.twse || !s.tpex) warns.push(`本日${!s.twse?"上市":""}${!s.twse&&!s.tpex?"、":""}${!s.tpex?"上櫃":""}行情待補，結果僅涵蓋已載入市場，不代表另一市場無符合個股。`);
  if (!s.provisional && (!(s.inst_twse && s.inst_tpex) || (DATA.prevStatus && (!ps.inst_twse || !ps.inst_tpex)))) warns.push("投信資料（今日或前一交易日）有缺，投信相關條件於缺漏市場顯示為未判定。");
  if (!dispOk) warns.push("處置公告尚未涵蓋至本日，「下一交易日出關」結果待核對。");
  if (DATA.historyCount < 120) warns.push(`歷史資料僅 ${DATA.historyCount} 個交易日，MACD 需至少 120 筆，相關策略將顯示未判定。`);
  $("#warnBox").style.display = warns.length ? "block" : "none";
  $("#warnBox").innerHTML = warns.join("<br>");
}

// ---------- 載入 ----------
async function getDates(){
  try { const r = await fetch("api/dates", {cache:"no-store"}); if (r.ok) return await r.json(); } catch(e){}
  const r = await fetch("data/dates.json", {cache:"no-store"}); if (!r.ok) throw new Error("no data");
  STATIC = true; return await r.json();
}
async function loadDates(keep){
  const j = await getDates();
  const sel = $("#date"), prev = sel.value;
  sel.innerHTML = j.dates.map((d,i)=>{
    const part = !(d.twse && d.tpex && d.inst_twse && d.inst_tpex);
    return `<option value="${d.date}">${fmtD(d.date)}${i===0?"（最新）":""}${d.provisional?"（暫行）":part?"（部分）":""}</option>`;
  }).join("");
  if (keep && prev && j.dates.some(d=>d.date===prev)) sel.value = prev;
  if (STATIC){ $("#jobMsg").textContent = j.generatedAt ? `資料更新於 ${j.generatedAt}；交易日 13:35 暫行版、15:30 官方校正，之後自動補齊投信與處置。` : ""; return j.dates.length; }
  $("#btnUpdate").textContent = "更新資料";
  showJob(j.job);
  if (j.job?.running) setTimeout(pollJob, 1500);
  return j.dates.length;
}
async function loadScreen(){
  const d = $("#date").value;
  if (!d) { $("#statusPill").textContent = "尚無資料。"; return; }
  $("#summary").innerHTML = `<div class="desc">計算中…</div>`;
  DATA = await (await fetch(STATIC ? `data/screen/${d}.json` : "api/screen?date="+d)).json();
  statusBar(); run();
}
function showJob(job){
  $("#btnUpdate").disabled = !!job.running;
  $("#jobMsg").innerHTML = job.error ? `<span class="bad">更新失敗：${esc(job.error)}</span>` : (job.running ? `<span class="pend">${esc(job.msg)}</span>` : "");
}
async function pollJob(){
  const j = await (await fetch("api/update")).json(); showJob(j);
  if (j.running) setTimeout(pollJob, 1500);
  else { await loadDates(true); await loadScreen(); if (!j.error) { $("#jobMsg").textContent = "已更新"; setTimeout(()=>$("#jobMsg").textContent="", 3000); } }
}

// ---------- UI ----------
function buildUI(){
  $("#tabs").innerHTML = STRATS.map(s=>{
    const badge = s.k==="custom" ? "" : `<span class="badge">…</span>`;
    return `<div class="scard ${s.k==='custom'?'center':''} ${s.k==='picks'?'star':''}" role="button" tabindex="0" data-k="${s.k}"><span>${s.n}</span>${badge}</div>`;
  }).join("");
  $("#condGrid").innerHTML = CONDS.map((c,i)=>`<label><input type="checkbox" id="cb_${c.k}">${i+1}. ${c.n}</label>`).join("");
  document.querySelectorAll(".scard").forEach(t=>{ t.onclick=()=>selectStrat(t.dataset.k); t.onkeydown=e=>{ if(e.key==="Enter") selectStrat(t.dataset.k); }; });
  ["q","minClose","minVinc"].forEach(id=>$("#"+id).addEventListener("input", run));
  ["mkt","addTrust","sort","showUnd","macdSel"].forEach(id=>$("#"+id).addEventListener("change", run));
  CONDS.forEach(c=>$("#cb_"+c.k).addEventListener("change", run));
  $("#date").onchange = loadScreen;
  $("#btnReset").onclick = ()=>{ $("#q").value=""; $("#mkt").value=""; $("#minClose").value=200; $("#minVinc").value=""; $("#addTrust").checked=false; $("#sort").value="cDesc"; $("#showUnd").checked=false; run(); };
  $("#btnExport").onclick = exportCsv;
  $("#btnUpdate").onclick = async ()=>{ if (STATIC) return location.reload(); await fetch("api/update",{method:"POST"}); pollJob(); };
  $("#btnA2HS").onclick = async ()=>{
    if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; return; }
    $("#a2hs").showModal ? $("#a2hs").showModal() : alert("iPhone：分享 → 加入主畫面；Android：⋮ → 加到主畫面");
  };
  window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt = e; });
  if (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone) $("#btnA2HS").style.display = "none";
  $("#btnSave").onclick = ()=>{
    const n = $("#comboName").value.trim(); if (!n) { $("#comboName").focus(); return; }
    combos[n] = customSel(); store.set("tw-screener-combos", combos); fillCombos(n);
  };
  $("#comboSel").onchange = ()=>{
    const c = combos[$("#comboSel").value]; if (!c) return;
    CONDS.forEach(x=>$("#cb_"+x.k).checked = c.conds.includes(x.k)); $("#macdSel").value = c.macd||"";
    $("#comboName").value = $("#comboSel").value; run();
  };
  $("#btnDel").onclick = ()=>{ const n = $("#comboSel").value; if (!n) return; if (!confirm(`刪除組合「${n}」？`)) return; delete combos[n]; store.set("tw-screener-combos", combos); fillCombos(""); };
  fillCombos("");
}
function fillCombos(sel){
  $("#comboSel").innerHTML = `<option value="">—</option>`+Object.keys(combos).map(n=>`<option>${esc(n)}</option>`).join("");
  $("#comboSel").value = sel;
}
function selectStrat(k, noScroll){
  cur = k;
  document.querySelectorAll(".scard").forEach(t=>t.classList.toggle("on", t.dataset.k===k));
  $("#customPanel").classList.toggle("on", k==="custom");
  document.body.classList.toggle("picksMode", k==="picks");
  store.set("tw-screener-strat", k);
  run();
  if (!noScroll && mq.matches) $("#summary").scrollIntoView({behavior:"smooth", block:"start"});
}

$("#foot").innerHTML = `<p>各策略獨立篩選，不把所有條件疊在一起。共同條件：收盤價 ≥ 最低收盤價（預設 200 元）、預設依收盤價由高到低排序。「今日」指所選資料日期，「前日」指前一交易日（非日曆昨天）。</p>
<p>成交量（張）＝成交股數 ÷ 1,000；投信買超（張）＝投信買賣超股數 ÷ 1,000；量增幅＝（今日量 ÷ 前日量 − 1）× 100，前日量為 0 時標示無法計算；今日漲跌幅依當日參考價計算。收盤漲停：上櫃採櫃買中心公告之次日漲停價，上市以當日參考價 × 1.1 依升降單位捨去。MACD(12,26,9) 以未還原收盤價計算，EMA 以 SMA 初始化，柱體＝2 ×（DIF − 訊號線），不足 120 筆標示未判定。「前次符合日」為所選日期之前最近一次符合同一策略的交易日。資料不足一律列為未判定，不視為不成立。</p>
<p>資料來源：<a href="https://www.twse.com.tw/" style="color:inherit">臺灣證券交易所</a>、<a href="https://www.tpex.org.tw/" style="color:inherit">證券櫃檯買賣中心</a>。本工具僅供研究參考，非投資建議。</p>`;

buildUI();
selectStrat(STRATS.some(s=>s.k===store.get("tw-screener-strat","")) ? store.get("tw-screener-strat","") : "picks", true);
loadDates(false).then(n=>{ if (n) loadScreen(); else $("#statusPill").textContent = "尚無資料，請按「更新資料」（首次約需 20–30 分鐘回補歷史）。"; })
  .catch(()=>{ $("#statusPill").textContent = "無法載入資料：請確認網路連線（本機版請確認「啟動篩選平台.bat」正在執行）。"; });
if (!mq.matches && location.hostname.match(/^(localhost|127\.|192\.168\.|10\.)/)) fetch("api/info").then(r=>r.json()).then(j=>{
  if (j.lan?.length) $("#foot").insertAdjacentHTML("afterbegin", `<p style="color:var(--ink)">📱 手機（同一個 Wi‑Fi）可開啟：<b>${j.lan.map(esc).join("　或　")}</b></p>`);
}).catch(()=>{});
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
